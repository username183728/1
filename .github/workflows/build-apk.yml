name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "APK build type"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: apk-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Verify Android project
        shell: bash
        run: |
          set -euxo pipefail
          test -f gradlew
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/example/aidetest/MainActivity.kt
          chmod +x gradlew

      - name: Static stability checks
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -c 'minifyEnabled false' app/build.gradle)" -ge 1
          if grep -RInE 'imageInfoResult|imageToolsResult' app/src/main/java --include='*.kt'; then
            echo "::error::Stale Image Studio callback references found."
            exit 1
          fi
          grep -q 'android:name=".MainActivity"' app/src/main/AndroidManifest.xml
          grep -q 'android:exported="true"' app/src/main/AndroidManifest.xml
          echo "Static stability checks passed."

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
        with:
          min-wrapper-count: 1

      - name: Build debug APK
        if: ${{ github.event_name == 'push' || github.event.inputs.build_type == 'debug' }}
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleDebug --console=plain --no-daemon 2>&1 | tee build-debug.log

      - name: Build release APK
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.build_type == 'release' }}
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleRelease --console=plain --no-daemon 2>&1 | tee build-release.log

      - name: Show real build errors
        if: failure()
        shell: bash
        run: |
          for f in build-debug.log build-release.log; do
            [ -f "$f" ] || continue
            {
              echo "## Error utama ($f)"
              echo '```'
              grep -nE -B1 -A8 '^e: |What went wrong|Execution failed|OutOfMemoryError|Java heap space|Manifest merger|AAPT: error|error: |Could not resolve|Could not find|SDK location|License for package' "$f" | head -150 || true
              echo '```'
            } | tee -a "$GITHUB_STEP_SUMMARY"
          done

      - name: List generated APKs
        if: always()
        shell: bash
        run: |
          echo "=== APK files ==="
          find app/build/outputs -type f -name "*.apk" -print 2>/dev/null || true
          echo "=== Build reports ==="
          find app/build/reports -maxdepth 3 -type f -print 2>/dev/null | head -100 || true

      - name: Upload debug APK
        if: ${{ success() && (github.event_name == 'push' || github.event.inputs.build_type == 'debug') }}
        uses: actions/upload-artifact@v4
        with:
          name: GITLS-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release APK
        if: ${{ success() && github.event_name == 'workflow_dispatch' && github.event.inputs.build_type == 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: GITLS-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GITLS-build-diagnostics
          path: |
            build-debug.log
            build-release.log
            app/build/reports/**
            app/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 14
