name: Build GITLS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK environment
        shell: bash
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"

      - name: Find sdkmanager
        shell: bash
        run: |
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -name sdkmanager -type f | head -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager tidak ditemukan"
            exit 1
          fi
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          "$SDKMANAGER" --version

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

      - name: Install required Android SDK
        shell: bash
        run: |
          "$SDKMANAGER" "platform-tools"
          "$SDKMANAGER" "platforms;android-36"
          "$SDKMANAGER" "build-tools;36.0.0"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Build release APK
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GITLS-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: GITLS-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          
