name: GITLS Android Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          # ubuntu-latest already ships Android SDK. Avoid android-actions/setup-android
          # because it tries to install obsolete package "tools" and fails with:
          #   Failed to find package 'tools'
          : "${ANDROID_HOME:=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_HOME
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          test -d "$ANDROID_HOME" || { echo "::error::ANDROID_HOME missing: $ANDROID_HOME"; exit 1; }

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n1 || true)"
          if [ -z "$SDKMANAGER" ] && [ -x "$ANDROID_HOME/tools/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/tools/bin/sdkmanager"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found under $ANDROID_HOME"
            ls -la "$ANDROID_HOME" || true
            exit 1
          fi
          echo "sdkmanager=$SDKMANAGER"

          mkdir -p "$ANDROID_HOME/licenses"
          # Common Android SDK license hashes (idempotent)
          echo -e "24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n84831b9409646a918e30573bab4c9c3f8d71863b" > "$ANDROID_HOME/licenses/android-sdk-license"
          yes 2>/dev/null | "$SDKMANAGER" --licenses >/tmp/sdk-licenses.log 2>&1 || true
          tail -3 /tmp/sdk-licenses.log || true

          # Install only packages that still exist (never "tools")
          set +e
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;35.0.0" "platform-tools" >/tmp/sdk-install.log 2>&1
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::warning::sdkmanager install exit=$rc (AGP can still fetch components)"
            tail -40 /tmp/sdk-install.log || true
          fi
          echo "Android SDK prepare: OK"
          ls "$ANDROID_HOME/platforms" 2>/dev/null | tail -10 || true

      - name: Validate Android project root
        shell: bash
        run: |
          set -euo pipefail
          echo "== Repository root listing =="
          ls -la
          echo ""
          if [ ! -f ./gradlew ]; then
            echo "::error::gradlew tidak ditemukan di repository root."
            echo "::error::Extract ZIP ke root repo. Harus terlihat: gradlew, settings.gradle, app/, gradle/ — BUKAN folder gitls_finance/ di atasnya."
            find . -maxdepth 3 -type f \( -name gradlew -o -name settings.gradle \) 2>/dev/null || true
            exit 1
          fi
          test -f ./settings.gradle || test -f ./settings.gradle.kts || { echo "::error::settings.gradle(.kts) tidak ditemukan."; exit 1; }
          test -f ./app/build.gradle || test -f ./app/build.gradle.kts || { echo "::error::app/build.gradle(.kts) tidak ditemukan."; exit 1; }
          test -f ./gradle/wrapper/gradle-wrapper.jar || { echo "::error::gradle/wrapper/gradle-wrapper.jar hilang."; exit 1; }
          test -f ./gradle/wrapper/gradle-wrapper.properties || { echo "::error::gradle-wrapper.properties hilang."; exit 1; }
          chmod +x ./gradlew
          chmod +x scripts/ci/preflight.sh scripts/ci/check_icons.py 2>/dev/null || true
          echo "Android project root: OK"
          head -1 ./gradlew
          cat ./gradle/wrapper/gradle-wrapper.properties

      - name: Validate project and signing hygiene
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew scripts/ci/preflight.sh scripts/ci/check_icons.py
          ./scripts/ci/preflight.sh

      - name: Gradle wrapper validation
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --version

      - name: Gradle clean
        run: ./gradlew --no-daemon --stacktrace clean

      - name: Compile Kotlin (debug)
        run: ./gradlew --no-daemon --stacktrace compileDebugKotlin

      - name: Unit tests
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Lint debug
        run: ./gradlew --no-daemon --stacktrace lintDebug

      - name: Assemble debug APK
        id: debug_apk
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify debug APK
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          unzip -t "$apk" >/dev/null
          sha256sum "$apk" | tee app-debug.apk.sha256
          ls -lh "$apk"

      - name: Check release signing secrets
        id: signing
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ] && \
             [ -n "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" ] && \
             [ -n "${{ secrets.ANDROID_KEY_ALIAS }}" ] && \
             [ -n "${{ secrets.ANDROID_KEY_PASSWORD }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Release signing secrets: configured"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Release signing secrets belum tersedia; build debug tetap dilanjutkan."
          fi

      - name: Assemble signed release
        id: release_apk
        if: ${{ steps.signing.outputs.configured == 'true' }}
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          install -d signing
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > signing/ci-release.keystore
          test -s signing/ci-release.keystore
          export ANDROID_KEYSTORE_PATH="$PWD/signing/ci-release.keystore"
          export ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD
          ./gradlew --no-daemon --stacktrace assembleRelease
          apk="app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          unzip -t "$apk" >/dev/null
          APKSIGNER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools -type f -name apksigner 2>/dev/null | sort -V | tail -n1 || true)"
          [[ -n "$APKSIGNER" ]] || { echo "::error::apksigner tidak ditemukan pada Android SDK."; exit 1; }
          "$APKSIGNER" verify --verbose "$apk"
          sha256sum "$apk" | tee app-release.apk.sha256

      - name: Upload debug APK
        if: ${{ always() && steps.debug_apk.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: GITLS-debug-${{ github.run_number }}
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app-debug.apk.sha256

      - name: Assemble Studio Kreatif APK
        id: studio_apk
        if: ${{ steps.debug_apk.outcome == 'success' }}
        run: |
          set -euo pipefail
          # APK terpisah: editor foto & desain "Studio Kreatif" (applicationId com.gitls.studio)
          ./gradlew --no-daemon --stacktrace assembleDebug -PstudioApp=true
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          unzip -t "$apk" >/dev/null
          cp "$apk" studio-kreatif-debug.apk
          sha256sum studio-kreatif-debug.apk | tee studio-kreatif-debug.apk.sha256
          ls -lh studio-kreatif-debug.apk

      - name: Upload Studio Kreatif APK
        if: ${{ steps.studio_apk.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: StudioKreatif-debug-${{ github.run_number }}
          if-no-files-found: error
          path: |
            studio-kreatif-debug.apk
            studio-kreatif-debug.apk.sha256

      - name: Upload release APK
        if: ${{ steps.signing.outputs.configured == 'true' && steps.release_apk.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: GITLS-release-${{ github.run_number }}
          if-no-files-found: error
          path: |
            app/build/outputs/apk/release/app-release.apk
            app-release.apk.sha256

      - name: Upload CI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GITLS-ci-diagnostics-${{ github.run_number }}
          if-no-files-found: warn
          path: |
            app/build/reports/**
            app/build/outputs/lint-results*
            app/build/test-results/**
